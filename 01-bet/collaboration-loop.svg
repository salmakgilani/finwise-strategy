<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>FinWise collaboration growth loop</title>
  <desc>A trial owner hits a shared finance task, invites an accountant or co-founder, they work together in shared data, the business converts to paid, and the accountant brings new firms who start trials and restart the loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="300" fill="#FFFFFF"/>

  <rect x="40" y="40" width="186" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="133" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Shared task arises</text>
  <text x="133" y="85" text-anchor="middle" font-size="12" fill="#993C1D">Forecast or month-end</text>

  <rect x="247" y="40" width="186" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Owner invites a peer</text>
  <text x="340" y="85" text-anchor="middle" font-size="12" fill="#534AB7">Accountant or co-founder</text>

  <rect x="454" y="40" width="186" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="547" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">They work together</text>
  <text x="547" y="85" text-anchor="middle" font-size="12" fill="#534AB7">Shared data, comments</text>

  <rect x="454" y="180" width="186" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="547" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Business converts</text>
  <text x="547" y="225" text-anchor="middle" font-size="12" fill="#534AB7">Trial ends, team stays</text>

  <rect x="247" y="180" width="186" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="205" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">New firms join</text>
  <text x="340" y="225" text-anchor="middle" font-size="12" fill="#0F6E56">Accountant brings clients</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="227" y1="70" x2="245" y2="70" marker-end="url(#arrow)"/>
    <line x1="434" y1="70" x2="452" y2="70" marker-end="url(#arrow)"/>
    <line x1="547" y1="101" x2="547" y2="178" marker-end="url(#arrow)"/>
    <line x1="453" y1="210" x2="435" y2="210" marker-end="url(#arrow)"/>
    <path d="M246 210 L133 210 L133 102" marker-end="url(#arrow)"/>
  </g>

  <rect x="40" y="264" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="58" y="274" font-size="12" fill="#5F5E5A">Trigger</text>
  <rect x="130" y="264" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="148" y="274" font-size="12" fill="#5F5E5A">Loop stage</text>
  <rect x="240" y="264" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="258" y="274" font-size="12" fill="#5F5E5A">Outcome that restarts the loop</text>
</svg>
